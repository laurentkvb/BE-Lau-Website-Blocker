<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Blocked</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="block-container">
    <div class="block-card">
      <h1>Website Blocked</h1>
      <p class="blocked-url">Attempted URL: <span id="blockedUrl">Unknown</span></p>
      <div class="quote-card">
        <p id="quoteText" class="quote-text"></p>
        <p id="quoteAuthor" class="quote-author"></p>
      </div>
      <div class="block-actions">
        <button id="backButton" class="primary-button">Go Back</button>
        <button id="optionsButton" class="secondary-button">Open Dashboard</button>
      </div>
    </div>
  </main>

  <script src="quotes.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
