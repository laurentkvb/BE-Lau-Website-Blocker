<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Blocker Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Website Blocker</h1>
      <p>Manage blocked domains and set temporary focus breaks with unblock timers.</p>
    </header>

    <section class="card">
      <div class="form-row">
        <label for="siteInput">Add domain to block</label>
        <input id="siteInput" type="text" placeholder="example.com" autocomplete="off" />
        <button id="addButton">Add Site</button>
      </div>
      <div class="form-row action-row">
        <button id="unblockAllButton">Unblock All for 5 Minutes</button>
        <button id="reblockAllButton" class="secondary-button" hidden>Re-block All Now</button>
        <span id="statusMessage" class="status-message"></span>
      </div>
    </section>

    <section class="card">
      <h2>Blocked Sites</h2>
      <div id="siteList" class="site-list"></div>
    </section>
  </div>

  <script src="options.js"></script>
</body>
</html>
